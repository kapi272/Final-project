# Mosquitto Access Control List (ACL)
# Unauthenticated / Anonymous Clients (Simulated Nodes, Guest Nodes, Honeypot Traps)
topic readwrite home/sensors/#
topic readwrite home/devices/#
topic readwrite home/admin/#
topic readwrite home/debug/#
topic readwrite home/system/#
topic readwrite home/gateway/#
topic read $SYS/#

# Authenticated SOC Controller & Management Administrator
user soc_admin
topic readwrite #

# Authenticated Production IoT Gateway Node
user iot_gateway
topic readwrite home/#
